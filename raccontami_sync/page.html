<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Raccontami server</title>
<style>
  :root {
    --page: #eef1f4; --surface: #f8f9fb; --line: #cfd5dd; --text: #1c2330; --muted: #5a6474;
    --accent: #1d4fbf; --on-accent: #ffffff; --danger: #b3261e; --mark: #fbe27a; --track: #dde2e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #14181f; --surface: #1c222b; --line: #333c49; --text: #e6e9ee; --muted: #9aa4b2;
      --accent: #8fb0ff; --on-accent: #0f1626; --danger: #ff8a80; --mark: #6b5a12; --track: #2a323d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font: 700 30px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 4px; }
  h1 span { background: linear-gradient(transparent 55%, var(--mark) 55%); }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 32px 0 10px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .state { font-weight: 600; }
  h3 { font: 700 20px/1.3 Georgia, "Times New Roman", serif; margin: 6px 0 2px; overflow-wrap: anywhere; }
  .card .facts { margin: 4px 0 14px; font-size: 15px; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin: 10px 0 12px; }
  .bar div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
  button { font: inherit; font-weight: 600; border-radius: 999px; padding: 8px 18px; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: var(--accent); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--page); color: var(--text); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .error { color: var(--danger); margin-top: 8px; }
  /* what went wrong stays in view while the page is scrolled: the button pressed may be far down */
  .notice { position: sticky; top: 8px; z-index: 1; margin-top: 16px; padding: 10px 14px; border-radius: 10px;
            background: var(--surface); border: 1px solid var(--danger); color: var(--danger); font-weight: 600; }
  .stale { opacity: .55; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  /* a job's facts fold away on a phone, so its state and its buttons fit on one screen */
  details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 15px; padding: 8px 0; width: max-content; }
  details.more summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  details.more .facts { margin: 4px 0 4px; }
  .card .row + details.more, .card .why + details.more { margin-top: 6px; }
  .why { margin: 0 0 10px; }
  .hint { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 10px 0 0; }
  .check input { width: auto; }
  .done-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0;
              border-top: 1px solid var(--line); }
  .done-row div { min-width: 0; overflow-wrap: anywhere; }
  .done-row button { flex: none; }
  @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
  .langs { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 6px; }
  .langs button { border: 0; padding: 6px 10px; font-weight: 400; color: var(--muted); }
  .langs button[aria-current] { color: var(--text); font-weight: 600; text-decoration: underline; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><span>Raccontami</span><b id="titleRest" data-t="titleRest" style="font-weight:inherit"> server</b></h1>
  <p class="muted" id="subtitle" data-t="subtitleDefault">What this computer is working on for your phone.</p>
  <p class="notice" id="notice" role="status" hidden></p>

  <section id="signin" hidden>
    <h2 data-t="tokenHead">Token</h2>
    <div class="card">
      <form id="tokenForm">
        <label for="token" data-t="tokenLabel">The server's token</label>
        <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required
               aria-describedby="tokenHelp tokenError">
        <label class="check"><input id="showToken" type="checkbox"> <span data-t="showTyped">Show what I type</span></label>
        <p class="muted small" id="tokenHelp" style="margin-top:8px" data-t="tokenHelp">Shown in the server's window when it starts.</p>
        <p class="error" id="tokenError" role="alert" hidden></p>
        <div class="row" style="margin-top:14px"><button class="primary" type="submit" data-t="open">Open</button></div>
      </form>
    </div>
  </section>

  <section id="content" hidden>
    <h2 data-t="work">Work</h2>
    <div id="work">
      <div class="row" id="all" style="margin-bottom:12px" hidden>
        <button id="holdAll" type="button" data-t="holdAll">Put everything on hold</button>
        <button id="continueAll" type="button" data-t="continueAll">Continue what is on hold</button>
      </div>
      <div id="jobs"></div>
      <p class="muted" id="none" hidden data-t="none">Nothing to do.</p>

      <h2 id="doneHead" hidden data-t="finished">Finished</h2>
      <div class="card" id="doneCard" hidden>
        <p id="doneSummary"></p>
        <p class="muted small" style="margin-top:6px" data-t="doneNote">The phone has its own copy of a story once it has downloaded it.</p>
        <details class="more" id="doneMore"><summary>Show them</summary><div id="done"></div></details>
      </div>
    </div>

    <h2 data-t="thisServer">This server</h2>
    <div class="card">
      <dl class="facts" id="facts"></dl>
      <div class="row" style="margin-top:14px">
        <button id="check" type="button" data-t="check">Check for a newer version</button>
        <button id="forget" type="button" data-t="forget">Forget the token in this browser</button>
      </div>
      <p class="muted small" style="margin-top:8px" data-t="checkNote">The check asks GitHub, and only when you press it.</p>
      <p id="checkResult" role="status" style="margin-top:10px" hidden></p>
    </div>
  </section>

  <p class="langs" id="langs"></p>
</main>

    done1: "Bu bilgisayarda biten 1 iş saklanıyor", doneN: "Bu bilgisayarda biten {0} iş saklanıyor", taking: "; kapladıkları yer {0}.",
    showIt: "Göster", showThem: "Göster", narration: "Seslendirme", sync: "Eşitleme", finishedAt: "bitiş: {0}",
    confirmDoneNarr: "Biten “{0}” seslendirmesi bu bilgisayardan silinsin mi?\n\nTelefon hikâyeyi indirdiyse hikâye telefonda kalır. İndirmediyse uygulamadan yeniden gönderilmesi gerekir ve iş yeniden yapılır.\n\nBu geri alınamaz.",
    confirmDoneSync: "Biten “{0}” eşitlemesi bu bilgisayardan silinsin mi?\n\nTelefon hikâyeyi indirdiyse hikâye telefonda kalır. İndirmediyse uygulamadan yeniden gönderilmesi gerekir ve iş yeniden yapılır.\n\nBu geri alınamaz.",
    fName: "Ad", fGpu: "Ekran kartı", gpuNone: "bulunamadı", fFree: "Boş disk alanı",
    freeLow: "{0}: az kaldı. Seslendirilen bir kitap yapılırken birkaç GB yer tutar", fVersion: "Sürüm",
    check: "Daha yeni bir sürüm var mı, bak", checkNote: "Denetim GitHub'a sorar, yalnızca düğmeye bastığında.", checking: "GitHub'a soruluyor…",
    upToDate: "Bu en son sürüm ({0}).", newer: "{0} sürümü çıktı; bu sunucuda {1} var.", whatsNew: "Yenilikler: {0}",
    howUpdate: "Nasıl güncellenir", checkFailed: "GitHub'a sorulamadı. Bu sayfanın açık olduğu cihazın internet bağlantısını denetle.",
    cause_memory: "Ekran kartının belleği doldu. Onu kullanan başka şeyleri (bir oyun, başka bir yapay zekâ programı) kapat ve sürdür; 12 GB'tan küçük bir kartta settings.txt dosyasına RACCONTAMI_ONE_JOB=1 yaz.",
    cause_disk: "Disk dolu. Aşağıdaki biten işleri sil ya da sürücüde yer aç, sonra sürdür.",
    cause_audio: "Ses dosyası okunamadı. Bir oynatıcıda dene; çalıyorsa MP3 ya da M4A'ya çevirip yeniden gönder.",
    cause_driver: "Ekran kartı ya da sürücüsü yanıt vermedi. NVIDIA sürücüsünü güncelle, bilgisayarı yeniden başlat ve sürdür.",
    cause_network: "Bir model indirilemedi. Bu bilgisayarın internet bağlantısını denetle ve sürdür.",
  },
};

// the reader's choice if there is one, otherwise the first language of the browser that the page has
function pickLanguage(saved, wanted) {
  if (saved && TEXTS[saved]) return saved;
  for (const w of wanted || []) {
    const short = String(w).toLowerCase().split("-")[0];
    if (TEXTS[short]) return short;
  }
  return "en";
}
let savedLang = "";
try { savedLang = localStorage.getItem(LANG_KEY) || ""; } catch (e) { /* follows the browser */ }
const LANG = pickLanguage(savedLang, navigator.languages || [navigator.language]);
document.documentElement.lang = LANG;

function t(key, ...values) {
  const text = TEXTS[LANG][key] != null ? TEXTS[LANG][key] : TEXTS.en[key];
  return text == null ? key : text.replace(/\{(\d)\}/g, (_, n) => values[n] != null ? values[n] : "");
}

for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
for (const code of Object.keys(TEXTS)) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = TEXTS[code].name;
  b.lang = code;
  if (code === LANG) b.setAttribute("aria-current", "true");
  b.addEventListener("click", () => {
    try { localStorage.setItem(LANG_KEY, code); } catch (e) { /* stays as the browser says */ }
    location.reload();
  });
  $("langs").append(b);
}

async function api(method, path) {
  const r = await fetch(path, { method, headers: { Authorization: "Bearer " + token }, cache: "no-store" });
  let body = null;
  try { body = await r.json(); } catch (e) { /* no body */ }
  if (!r.ok) {
    const err = new Error(body && body.detail ? said(String(body.detail)) : t("answered", r.status));
    err.status = r.status;
    throw err;
  }
  return body;
}

// The few things the server says in words when it refuses, in the page's language; the rest as it came.
function said(message) {
  return /^a sync (that )?is (still )?running/i.test(message) ? t("syncBusy") : message;
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

const two = n => String(n).padStart(2, "0");

function timeLeft(s) {
  if (s == null) return "";
  if (s < 90) return t("left1");
  if (s < 3600) return t("leftMin", Math.round(s / 60));
  return t("leftH", Math.floor(s / 3600), two(Math.round(s % 3600 / 60)));
}

function stateText(j) {
  if (j.holding) return t("stStopping");
  switch (j.state) {
    case "running": return t("stWorking", TEXTS.en["stage_" + j.stage] ? t("stage_" + j.stage) : j.stage);
    case "queued": return t("stWaiting");
    case "held": return t("stHeld");
    case "failed": return j.can.continue ? t("stFailedKept") : t("stFailed");
    case "done": return t("stDone");
    default: return j.state;
  }
}

// One line at the top for what the reader must know now: the server is gone (then what is shown
// below is old, and is dimmed and cannot be pressed), or the last thing asked for was refused.
let refused = "", lostAt = null;

function showNotice() {
  const lost = lostAt !== null;
  const text = lost ? t("lost", lostAt) + ($("content").hidden ? "" : t("lostBelow")) + t("lostRetry") : refused;
  $("notice").textContent = text;
  $("notice").hidden = !text;
  $("work").classList.toggle("stale", lost);
  $("work").inert = lost;
}

// A refusal is read once: it leaves after a while or at a tap, so it does not cover the page for good.
let refusedTimer = null;
function setRefused(message) {
  clearTimeout(refusedTimer);
  refused = message || "";
  if (refused) refusedTimer = setTimeout(() => setRefused(""), 15000);
  showNotice();
}

function showSignIn(message) {
  clearTimeout(timer);
  lostAt = null;
  setRefused("");
  $("content").hidden = true;
  $("signin").hidden = false;
  $("tokenError").hidden = !message;
  $("tokenError").textContent = message || "";
  $("token").focus();
  $("token").select();  // what was typed stays, to be corrected instead of typed again
}

function actionButton(label, cls, run) {
  const b = el("button", label, cls);
  b.type = "button";
  b.addEventListener("click", async () => {
    b.disabled = true;
    setRefused("");
    try { await run(); } catch (e) { setRefused(e.message); }
    b.disabled = false;  // the question may have been answered with no: the button must work again
    refresh();
  });
  return b;
}

// A card is built again only when what it offers changes; progress alone is written into the card
// that is there, so a button is never swapped away under the pointer or the keyboard.
const cards = new Map(); // job id -> { card, shape, numbers, fill }

function shapeOf(j) {
  return JSON.stringify([j.state, j.stage, j.holding, j.can, j.about, j.error, j.errorHint]);
}

function setProgress(c, j) {
  const pct = Math.round(j.progress * 100);
  c.numbers.textContent = pct + " %" + (j.etaSeconds != null ? " · " + timeLeft(j.etaSeconds) : "");
  c.fill.style.width = pct + "%";
  c.bar.setAttribute("aria-valuenow", pct);
  const d = j.details || {};
  c.live.pieces(d.piecesTotal ? t("piecesOf", count(d.piecesDone || 0), count(d.piecesTotal))
                : d.piecesDone ? t("piecesMade", count(d.piecesDone)) : "");
  const ready = d.audioReadySeconds ? t("ready", duration(d.audioReadySeconds)) : "";
  c.ready.textContent = ready;
  c.ready.hidden = !ready;
  c.live.last(d.lastWorked && j.state !== "queued" ? when(d.lastWorked) : "");
  c.live.size(d.bytes ? size(d.bytes) : "");
}

const count = n => Number(n).toLocaleString(LANG);

function size(bytes) {
  const mb = bytes / 1048576;
  return mb < 1000 ? Math.max(1, Math.round(mb)) + " MB"
                   : (mb / 1024).toLocaleString(LANG, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " GB";
}

const nameOf = j => (j.details || {}).title || t(j.kind === "narrate" ? "noNameNarr" : "noNameSync");

// Facts are open on a wide screen and folded on a phone, until the reader chooses; the choice is
// kept when a card is built again.
const factsOpen = new Map(); // job id -> what the reader chose
const wide = () => window.matchMedia("(min-width: 700px)").matches;

function duration(s) {
  if (s < 3600) return t("min", Math.max(1, Math.round(s / 60)));
  return t("hmin", Math.floor(s / 3600), two(Math.round(s % 3600 / 60)));
}

function when(epochSeconds) {
  return new Date(epochSeconds * 1000).toLocaleString(LANG, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

// A fact whose value changes while the page is open: returns how to set it; empty hides the line.
function liveFact(dl, name) {
  const dt = el("dt", name), dd = el("dd", "");
  dt.hidden = dd.hidden = true;
  dl.append(dt, dd);
  return value => { dd.textContent = value; dt.hidden = dd.hidden = !value; };
}

function showJobs(list) {
  const box = $("jobs");
  for (const id of [...cards.keys()]) if (!list.some(j => j.id === id)) { cards.get(id).card.remove(); cards.delete(id); }
  list.forEach((j, at) => {
    let c = cards.get(j.id);
    const shape = shapeOf(j);
    if (!c || c.shape !== shape) {
      const fresh = jobCard(j);
      fresh.shape = shape;
      if (c) c.card.replaceWith(fresh.card);
      cards.set(j.id, c = fresh);
    }
    setProgress(c, j);
    if (box.children[at] !== c.card) box.insertBefore(c.card, box.children[at] || null);
  });
}

// What went wrong: in the reader's words when the server knows the cause, otherwise the start of
// what it reported. A failure is never shown without a reason.
function whyFailed(j) {
  if (j.errorCause && TEXTS.en["cause_" + j.errorCause]) return t("cause_" + j.errorCause);
  if (j.errorHint) return j.errorHint;
  return j.error ? t("reported", j.error.length > 220 ? j.error.slice(0, 220) + " …" : j.error) : "";
}

function jobCard(j) {
  const card = el("div", null, "card");
  const head = el("div", null, "row");
  const numbers = el("span", "", "muted");
  head.append(el("span", stateText(j), "state"), numbers);
  const d = j.details || {};
  const narration = j.kind === "narrate";
  card.append(head, el("h3", nameOf(j)));
  if (!d.title) card.append(el("p", t("noNameNote"), "muted small"));
  const bar = el("div", null, "bar"), fill = el("div");
  bar.setAttribute("role", "progressbar");
  bar.setAttribute("aria-label", t("progressOf", nameOf(j)));
  bar.setAttribute("aria-valuemin", "0");
  bar.setAttribute("aria-valuemax", "100");
  bar.append(fill);
  card.append(bar);
  const ready = el("p", "", "why");
  ready.hidden = true;
  card.append(ready);
  if (j.state === "failed" && whyFailed(j)) card.append(el("p", whyFailed(j), "hint"));
  const buttons = el("div", null, "row");
  const at = "/v1/jobs/" + encodeURIComponent(j.id);
  if (j.can.continue) buttons.append(actionButton(t("continue"), "primary", () => api("POST", at + "/continue")));
  if (j.can.hold) buttons.append(actionButton(t("hold"), "", () => api("POST", at + "/hold")));
  if (j.can.delete) buttons.append(actionButton(t("delete"), "danger", async () => {
    if (confirm(t(narration ? "confirmNarr" : "confirmSync"))) await api("DELETE", at);
  }));
  if (buttons.childElementCount) card.append(buttons);
  else if (j.state === "running") card.append(el("p", t("syncBusy"), "muted small why"));
  if (j.state === "held") card.append(el("p", t("heldNote"), "muted small why"));
  const more = el("details", null, "more");
  more.append(el("summary", t("details")));
  more.open = factsOpen.has(j.id) ? factsOpen.get(j.id) : wide();
  more.addEventListener("toggle", () => factsOpen.set(j.id, more.open));
  const dl = el("dl", null, "facts");
  fact(dl, t("fWhat"), t(narration ? "whatNarr" : "whatSync"));
  if (d.beginning) fact(dl, t("fBegins"), "“" + d.beginning + " …”");
  fact(dl, t("fLanguage"), languageName(d.language));
  if (d.words) fact(dl, t("fLength"), d.audioSecondsAbout ? t("wordsAudio", count(d.words), duration(d.audioSecondsAbout))
                                                         : t("words", count(d.words)));
  if (narration) fact(dl, t("fVoices"), d.narrators ? t("voicesMany", d.narrators, d.voices) : t("voiceOne"));
  const live = { pieces: liveFact(dl, t("fPieces")) };
  if (d.sent) fact(dl, t("fSent"), d.device ? t("sentFrom", when(d.sent), d.device) : when(d.sent));
  live.last = liveFact(dl, t("fLast"));
  live.size = liveFact(dl, t("fDisk"));
  if (j.state === "failed" && j.error) fact(dl, t("fError"), j.error);
  more.append(dl);
  card.append(more);
  return { card, numbers, fill, bar, ready, live };
}

// the server names a story's language in English
const languageName = name => name && TEXTS.en["lang_" + name] ? t("lang_" + name) : name;

// Finished jobs: how much room they take, and a way to delete each. The list is built again only
// when it changes, so a button is not swapped away while it is being pressed.
let doneShape = "";

function showDone(list) {
  $("doneHead").hidden = $("doneCard").hidden = list.length === 0;
  const shape = JSON.stringify(list.map(j => [j.id, (j.details || {}).bytes]));
  if (shape === doneShape) return;
  doneShape = shape;
  const total = list.reduce((sum, j) => sum + ((j.details || {}).bytes || 0), 0);
  $("doneSummary").textContent = (list.length === 1 ? t("done1") : t("doneN", count(list.length)))
    + (total ? t("taking", size(total)) : ".");
  $("doneMore").firstElementChild.textContent = t(list.length === 1 ? "showIt" : "showThem");
  const box = $("done");
  box.replaceChildren();
  for (const j of list) {
    const d = j.details || {}, narration = j.kind === "narrate";
    const row = el("div", null, "done-row"), text = el("div");
    text.append(el("div", nameOf(j), "state"),
                el("div", [t(narration ? "narration" : "sync"), languageName(d.language), d.bytes ? size(d.bytes) : null,
                           d.lastWorked ? t("finishedAt", when(d.lastWorked)) : null].filter(Boolean).join(" · "), "muted small"));
    row.append(text);
    if (j.can.delete) {
      const b = actionButton(t("delete"), "danger", async () => {
        if (confirm(t(narration ? "confirmDoneNarr" : "confirmDoneSync", nameOf(j)))) {
          await api("DELETE", "/v1/jobs/" + encodeURIComponent(j.id));
        }
      });
      b.setAttribute("aria-label", t("deleteNamed", nameOf(j)));
      row.append(b);
    }
    box.append(row);
  }
}

function fact(dl, name, value) {
  if (value == null || value === "") return;
  dl.append(el("dt", name), el("dd", String(value)));
}

let lastHealth = null;

async function refresh() {
  clearTimeout(timer);
  try {
    const [health, jobs] = await Promise.all([api("GET", "/v1/health"), api("GET", "/v1/jobs")]);
    lastHealth = health;
    $("signin").hidden = true;
    $("content").hidden = false;
    $("token").value = "";  // accepted: no longer needed on the page
    lostAt = null;
    showNotice();
    $("subtitle").textContent = health.name ? t("subtitle", health.name) : t("subtitleDefault");
    const shown = jobs.filter(j => j.state !== "done");
    showJobs(shown);
    showDone(jobs.filter(j => j.state === "done"));
    $("none").hidden = shown.length > 0;
    // for everything at once, as in the icon's menu: worth showing when there is more than one job to press
    const canHold = shown.filter(j => j.can.hold).length, onHold = shown.filter(j => j.state === "held").length;
    $("holdAll").hidden = canHold < 2;
    $("continueAll").hidden = onHold < 2;
    $("all").hidden = canHold < 2 && onHold < 2;
    const dl = $("facts");
    dl.replaceChildren();
    fact(dl, t("fName"), health.name);
    fact(dl, t("fGpu"), health.gpu || t("gpuNone"));
    fact(dl, t("fVoices"), Object.entries(health.narration || {}).map(([lang, v]) => lang + ": " + v).join(", "));
    if (health.freeBytes != null) {
      fact(dl, t("fFree"), health.freeBytes < 10 * 1073741824 ? t("freeLow", size(health.freeBytes)) : size(health.freeBytes));
    }
    fact(dl, t("fVersion"), health.version);
    $("check").hidden = !health.latestUrl;
  } catch (e) {
    if (e.status === 401) { showSignIn(token ? t("badToken") : ""); return; }
    if (lostAt === null) lostAt = new Date().toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
    showNotice();
  }
  timer = setTimeout(refresh, 3000);
}

// ---- a newer version: asked of GitHub only when the button is pressed, from this browser.
// Versions are numbers with dots; they are compared number by number, so 0.10 comes after 0.9.
function isNewer(theirs, ours) {
  const a = String(theirs).split(".").map(n => parseInt(n, 10) || 0), b = String(ours).split(".").map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
  }
  return false;
}

async function checkVersion() {
  const out = $("checkResult");
  out.hidden = false;
  out.className = "muted";
  out.textContent = t("checking");
  $("check").disabled = true;
  try {
    const r = await fetch(lastHealth.latestUrl, { cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" });
    if (!r.ok) throw new Error(String(r.status));
    const latest = await r.json();
    out.className = "";
    if (isNewer(latest.version, lastHealth.version)) {
      out.textContent = t("newer", latest.version, lastHealth.version) + (latest.notes ? " " + t("whatsNew", latest.notes) : "") + " ";
      const a = el("a", t("howUpdate"));
      a.href = "https://github.com/alessandrobelli/raccontami-server#updating";
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      out.append(a);
    } else {
      out.textContent = t("upToDate", lastHealth.version);
    }
  } catch (e) {
    out.className = "error";
    out.textContent = t("checkFailed");
  }
  $("check").disabled = false;
}

$("tokenForm").addEventListener("submit", ev => {
  ev.preventDefault();
  token = $("token").value.trim();
  try { localStorage.setItem(KEY, token); } catch (e) { /* kept for this visit only */ }
  refresh();
});
for (const [id, path] of [["holdAll", "/v1/hold"], ["continueAll", "/v1/continue"]]) {
  $(id).addEventListener("click", async () => {
    setRefused("");
    try {
      const r = await api("POST", path);
      if (r && r.message) setRefused(said(r.message));
    } catch (e) { setRefused(e.message); }
    refresh();
  });
}
$("check").addEventListener("click", checkVersion);
$("showToken").addEventListener("change", () => { $("token").type = $("showToken").checked ? "text" : "password"; });
$("notice").addEventListener("click", () => setRefused(""));
$("forget").addEventListener("click", () => {
  token = "";
  try { localStorage.removeItem(KEY); } catch (e) { /* nothing was kept */ }
  showSignIn("");
});

if (token) refresh(); else showSignIn("");
</script>
</body>
</html>
